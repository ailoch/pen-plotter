[pytest]
testpaths = tests
markers =
    slow: full-pipeline geometry measurement; deselect with -m "not slow"

# sre_parse and sre_constants are used in lark-parser (a commentjson dependency), not code within this project
filterwarnings =
    ignore:module 'sre_parse' is deprecated:DeprecationWarning
    ignore:module 'sre_constants' is deprecated:DeprecationWarning
